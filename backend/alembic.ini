# Alembic配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库连接字符串（从环境变量读取）
# sqlalchemy.url = driver://user:pass@localhost/dbname

# 模板
# file_template = %%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 换行符
truncate_slug_length = 40

# 是否输出SQL到控制台
# echo = true

[post_write_hooks]
# 格式化钩子
hooks = black
black.type = console_scripts
black.entrypoint = black

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
